<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dischi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <style>
      html,
      body {
        background: #e4e0d8;
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
      }
      .debug-range {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        width: 100%;
        height: 16px;
        margin: 0;
        background: transparent;
        cursor: pointer;
        touch-action: none;
      }
      .debug-range:focus {
        outline: none;
      }
      .debug-range::-webkit-slider-runnable-track {
        height: 1px;
        background: #1c1b19;
      }
      .debug-range::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 11px;
        height: 11px;
        margin-top: -5px;
        border-radius: 999px;
        background: #1c1b19;
      }
      .debug-range::-moz-range-track {
        height: 1px;
        background: #1c1b19;
        border: none;
      }
      .debug-range::-moz-range-thumb {
        width: 11px;
        height: 11px;
        border: none;
        border-radius: 999px;
        background: #1c1b19;
      }
    </style>
  </head>
  <body class="overflow-x-hidden bg-[#e4e0d8] text-[#1c1b19] antialiased">
    <main id="stage" class="relative h-screen w-full">
      <canvas id="view" class="absolute inset-0" aria-label="Carosello di dischi"></canvas>

      <div class="pointer-events-none absolute left-6 top-6 z-10 md:left-12 md:top-12">
        <p class="text-[11px] uppercase tracking-[0.32em] text-neutral-500">Collezione</p>
        <h1 id="disc-title" class="mt-3 font-serif text-4xl leading-none tracking-tight md:text-6xl"></h1>
        <div id="disc-rule" class="mt-5 h-px w-14 bg-neutral-800"></div>
      </div>

      <p class="pointer-events-none absolute bottom-6 left-6 z-10 text-[11px] uppercase tracking-[0.32em] text-neutral-500 md:left-12">
        Scorri
      </p>

      <aside
        id="debug"
        class="absolute right-4 top-4 z-20 hidden w-52 rounded-md border border-[#1c1b19]/10 bg-[#f4f1ea]/95 p-3.5 text-[11px] text-[#1c1b19] shadow-[0_10px_40px_rgba(28,27,25,0.06)] backdrop-blur-sm md:right-8 md:top-8"
      >
        <p class="uppercase tracking-[0.28em] text-neutral-500">Debug</p>

        <label class="mt-3.5 block">
          <span class="flex items-baseline justify-between gap-3">
            <span class="uppercase tracking-[0.18em] text-neutral-600">Spaziatura</span>
            <span id="out-spacing" class="tabular-nums">1.70</span>
          </span>
          <span class="relative mt-1.5 block">
            <span class="pointer-events-none absolute left-1/2 top-1/2 z-0 h-2.5 w-px -translate-x-1/2 -translate-y-1/2 bg-neutral-400/90"></span>
            <input
              id="ctl-spacing"
              class="debug-range relative z-10"
              type="range"
              min="0.5"
              max="2.9"
              step="0.01"
              value="1.7"
              aria-label="Spaziatura tra i dischi"
            />
          </span>
        </label>

        <label class="mt-3 block">
          <span class="flex items-baseline justify-between gap-3">
            <span class="uppercase tracking-[0.18em] text-neutral-600">Dimensione</span>
            <span id="out-size" class="tabular-nums">1.00</span>
          </span>
          <span class="relative mt-1.5 block">
            <span class="pointer-events-none absolute left-1/2 top-1/2 z-0 h-2.5 w-px -translate-x-1/2 -translate-y-1/2 bg-neutral-400/90"></span>
            <input
              id="ctl-size"
              class="debug-range relative z-10"
              type="range"
              min="0.55"
              max="1.45"
              step="0.01"
              value="1"
              aria-label="Dimensione dei dischi"
            />
          </span>
        </label>

        <label class="mt-3 block">
          <span class="flex items-baseline justify-between gap-3">
            <span class="uppercase tracking-[0.18em] text-neutral-600">Spessore</span>
            <span id="out-thickness" class="tabular-nums">0.50</span>
          </span>
          <span class="relative mt-1.5 block">
            <span class="pointer-events-none absolute left-1/2 top-1/2 z-0 h-2.5 w-px -translate-x-1/2 -translate-y-1/2 bg-neutral-400/90"></span>
            <input
              id="ctl-thickness"
              class="debug-range relative z-10"
              type="range"
              min="0.08"
              max="0.92"
              step="0.01"
              value="0.5"
              aria-label="Spessore dei dischi"
            />
          </span>
        </label>

        <label class="mt-3 block">
          <span class="flex items-baseline justify-between gap-3">
            <span class="uppercase tracking-[0.18em] text-neutral-600">Curvatura</span>
            <span id="out-curve" class="tabular-nums">48°</span>
          </span>
          <span class="relative mt-1.5 block">
            <span class="pointer-events-none absolute left-1/2 top-1/2 z-0 h-2.5 w-px -translate-x-1/2 -translate-y-1/2 bg-neutral-400/90"></span>
            <input
              id="ctl-curve"
              class="debug-range relative z-10"
              type="range"
              min="0"
              max="96"
              step="1"
              value="48"
              aria-label="Angolo di curvatura del percorso"
            />
          </span>
        </label>
      </aside>
    </main>

    <footer class="px-6 py-20 text-sm text-neutral-500 md:px-12">
      Lo scroll sposta la fila. Il cursore inclina il disco, in senso opposto, intorno al suo centro.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      const discs = [
        { title: "Bruma", color: "#1b1d21" },
        { title: "Laguna", color: "#1d3c38" },
        { title: "Corallo", color: "#9a3a3a" },
        { title: "Paglia", color: "#c6b48a" },
        { title: "Vetro blu", color: "#243056" },
        { title: "Osso", color: "#ddd6ca" },
        { title: "Rame", color: "#7a4530" },
        { title: "Ulivo", color: "#3c4630" },
      ];

      const BG = 0xe4e0d8;
      const RADIUS = 1;
      const HOLE = 0.17;
      const NEAR_DISTANCE = 5.55;
      const FAR_DISTANCE = 8.65;
      const PATH_SAMPLES = 128;
      const PATH_LIFT_PX = 50;
      const params = { spacing: 1.7, size: 1, thickness: 0.5, curve: 48 };
      const BASE_EULER = new THREE.Euler(-0.64, 0.42, -0.2, "XYZ");
      const MAX_YAW = 0.32;
      const MAX_PITCH = 0.26;
      const LEAD = 3;

      const { gsap, ScrollTrigger } = window;
      gsap.registerPlugin(ScrollTrigger);

      const canvas = document.querySelector("#view");
      const titleEl = document.querySelector("#disc-title");
      const ruleEl = document.querySelector("#disc-rule");
      const stage = document.querySelector("#stage");

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(BG, 1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 80);
      camera.position.set(0.55, 1.45, 6.7);
      camera.lookAt(0.1, 0.02, 0);

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.045).texture;
      scene.environmentIntensity = 0.72;
      pmrem.dispose();

      const hemi = new THREE.HemisphereLight(0xfff8f0, 0xc8c0b4, 0.55);
      scene.add(hemi);

      const key = new THREE.DirectionalLight(0xfff3e6, 2.6);
      key.position.set(-4.8, 7.2, 6.2);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.near = 0.5;
      key.shadow.camera.far = 32;
      key.shadow.camera.left = -10;
      key.shadow.camera.right = 10;
      key.shadow.camera.top = 10;
      key.shadow.camera.bottom = -10;
      key.shadow.bias = -0.0004;
      key.shadow.normalBias = 0.03;
      key.shadow.radius = 3;
      scene.add(key);
      scene.add(key.target);

      const rim = new THREE.DirectionalLight(0xd5def0, 1.15);
      rim.position.set(6.5, 2.4, -3.2);
      scene.add(rim);

      const fill = new THREE.DirectionalLight(0xfff6ee, 0.45);
      fill.position.set(1.5, -2.5, 5.5);
      scene.add(fill);

      const glint = new THREE.PointLight(0xfffaf4, 36, 20, 2);
      glint.position.set(-2.4, 2.8, 4.4);
      scene.add(glint);

      const shadowMaterial = new THREE.MeshBasicMaterial({
        map: createShadowTexture(),
        transparent: true,
        depthWrite: false,
        toneMapped: false,
      });
      const shadowGeometry = new THREE.PlaneGeometry(2.7, 2.7);

      const silver = new THREE.MeshPhysicalMaterial({
        color: 0xd5d0c8,
        metalness: 0.08,
        roughness: 0.42,
        clearcoat: 0.35,
        clearcoatRoughness: 0.4,
        envMapIntensity: 0.35,
      });

      let discGeometry = createDiscGeometry(params.thickness);
      discGeometry.computeBoundingBox();
      let frontZ = discGeometry.boundingBox.max.z;

      const pickerGeometry = new THREE.CircleGeometry(RADIUS, 48);
      const pickerMaterial = new THREE.MeshBasicMaterial({
        colorWrite: false,
        depthWrite: false,
      });

      const row = new THREE.Group();
      scene.add(row);

      const pickers = [];
      const discMeshes = [];
      const slots = discs.map((item, index) => {
        const slot = new THREE.Group();

        const catcher = new THREE.Mesh(shadowGeometry, shadowMaterial);
        catcher.position.set(0.18, -0.22, -0.58);
        catcher.renderOrder = -1;
        slot.add(catcher);

        const tilt = new THREE.Group();
        tilt.quaternion.setFromEuler(BASE_EULER);
        slot.add(tilt);

        const body = new THREE.Group();
        tilt.add(body);

        const face = new THREE.MeshPhysicalMaterial({
          map: createLabelTexture(item.title, item.color),
          metalness: 0.05,
          roughness: 0.38,
          clearcoat: 1,
          clearcoatRoughness: 0.16,
          envMapIntensity: 0.48,
        });

        const mesh = new THREE.Mesh(discGeometry, [face, silver]);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        body.add(mesh);
        discMeshes.push(mesh);

        const picker = new THREE.Mesh(pickerGeometry, pickerMaterial);
        picker.position.z = frontZ + 0.03;
        picker.userData.tilt = tilt;
        body.add(picker);
        pickers.push(picker);

        tilt.userData.pitch = 0;
        tilt.userData.yaw = 0;
        tilt.userData.lift = 0;
        tilt.userData.scale = 1;
        tilt.userData.index = index;
        tilt.userData.body = body;

        row.add(slot);
        return tilt;
      });

      const baseQuat = new THREE.Quaternion().setFromEuler(BASE_EULER);
      const raycaster = new THREE.Raycaster();
      const pointer = { x: 0, y: 0, ndcX: 0, ndcY: 0, inside: false };
      const pointerNdc = new THREE.Vector2();
      const center = new THREE.Vector3();
      const ndc = new THREE.Vector3();
      const axisX = new THREE.Vector3(1, 0, 0);
      const axisY = new THREE.Vector3(0, 1, 0);
      const qYaw = new THREE.Quaternion();
      const qPitch = new THREE.Quaternion();
      const clock = new THREE.Clock();
      const _right = new THREE.Vector3();
      const _up = new THREE.Vector3();
      const _fwd = new THREE.Vector3();
      const _placed = new THREE.Vector3();
      const pathSamples = [];
      let focusLength = 0;
      let pathTotal = 0;
      let builtThickness = params.thickness;

      let progress = 0;
      let hovered = null;
      let activeIndex = -1;

      const scrollTrigger = ScrollTrigger.create({
        trigger: stage,
        start: "top top",
        end: "+=460%",
        pin: true,
        scrub: 0.7,
        anticipatePin: 1,
        onUpdate: (self) => {
          progress = self.progress;
        },
      });
      progress = scrollTrigger.progress;

      canvas.addEventListener("pointermove", (event) => {
        const rect = canvas.getBoundingClientRect();
        pointer.x = event.clientX - rect.left;
        pointer.y = event.clientY - rect.top;
        pointer.ndcX = (pointer.x / rect.width) * 2 - 1;
        pointer.ndcY = -((pointer.y / rect.height) * 2 - 1);
        pointer.inside = true;
      });
      canvas.addEventListener("pointerleave", () => {
        pointer.inside = false;
      });

      bindDebug();
      const resizeObserver = new ResizeObserver(resize);
      resizeObserver.observe(stage);
      resize();
      renderer.setAnimationLoop(frame);
      window.__carousel = {
        get hovered() {
          return hovered ? hovered.userData.index : null;
        },
        params,
        angles() {
          return slots.map((tilt) => ({
            i: tilt.userData.index,
            yaw: Number(tilt.userData.yaw.toFixed(3)),
            pitch: Number(tilt.userData.pitch.toFixed(3)),
          }));
        },
        layout() {
          return slots.map((tilt) => {
            tilt.getWorldPosition(center);
            const distance = camera.position.distanceTo(center);
            ndc.copy(center).project(camera);
            return {
              i: tilt.userData.index,
              x: Number(ndc.x.toFixed(3)),
              y: Number(ndc.y.toFixed(3)),
              distance: Number(distance.toFixed(2)),
            };
          });
        },
      };

      function frame() {
        const dt = Math.min(clock.getDelta(), 0.05);
        const travel = LEAD + progress * (discs.length - 1);

        for (const tilt of slots) {
          const along = tilt.userData.index - travel;
          const slot = tilt.parent;
          pointOnPath(along * params.spacing, slot.position);
          slot.scale.setScalar(params.size);
        }
        row.updateMatrixWorld(true);

        if (pathSamples.length) {
          const focus = pathSamples[PATH_SAMPLES / 2].point;
          key.position.set(focus.x - 4.8, focus.y + 7.2, focus.z + 6.2);
          key.target.position.copy(focus);
          key.target.updateMatrixWorld();
        }

        hovered = null;
        if (pointer.inside) {
          pointerNdc.set(pointer.ndcX, pointer.ndcY);
          raycaster.setFromCamera(pointerNdc, camera);
          const hits = raycaster.intersectObjects(pickers, false);
          hovered = hits[0]?.object.userData.tilt ?? null;
        }

        for (const tilt of slots) {
          const along = tilt.userData.index - travel;
          const focus = Math.exp(-along * along * 1.6);
          let targetYaw = 0;
          let targetPitch = 0;

          if (tilt === hovered) {
            tilt.getWorldPosition(center);
            const radiusPx = screenRadius(center, params.size * tilt.scale.x);
            ndc.copy(center).project(camera);
            const sx = (ndc.x * 0.5 + 0.5) * canvas.clientWidth;
            const sy = (-ndc.y * 0.5 + 0.5) * canvas.clientHeight;
            const dx = THREE.MathUtils.clamp((pointer.x - sx) / radiusPx, -1, 1);
            const dy = THREE.MathUtils.clamp((pointer.y - sy) / radiusPx, -1, 1);
            targetYaw = dx * MAX_YAW;
            targetPitch = dy * MAX_PITCH;
          }

          tilt.userData.yaw = THREE.MathUtils.damp(tilt.userData.yaw, targetYaw, 7, dt);
          tilt.userData.pitch = THREE.MathUtils.damp(tilt.userData.pitch, targetPitch, 7, dt);
          qYaw.setFromAxisAngle(axisY, tilt.userData.yaw);
          qPitch.setFromAxisAngle(axisX, tilt.userData.pitch);
          tilt.quaternion.copy(qYaw).multiply(qPitch).multiply(baseQuat);

          const targetLift = (tilt === hovered ? 0.22 : 0) + focus * 0.1;
          const targetScale = 1 + focus * 0.12 + (tilt === hovered ? 0.04 : 0);
          tilt.userData.lift = THREE.MathUtils.damp(tilt.userData.lift, targetLift, 7, dt);
          tilt.userData.scale = THREE.MathUtils.damp(tilt.userData.scale, targetScale, 7, dt);
          tilt.userData.body.position.z = tilt.userData.lift;
          tilt.scale.setScalar(tilt.userData.scale);
        }

        const nearest = Math.round(THREE.MathUtils.clamp(travel, 0, discs.length - 1));
        if (nearest !== activeIndex) {
          activeIndex = nearest;
          const item = discs[nearest];
          titleEl.textContent = item.title;
          ruleEl.style.backgroundColor = luminance(item.color) > 0.72 ? "#2a2825" : item.color;
        }

        canvas.style.cursor = hovered ? "pointer" : "default";
        renderer.render(scene, camera);
      }

      function bindDebug() {
        const panel = document.querySelector("#debug");
        if (new URLSearchParams(window.location.search).has("debug")) panel.classList.remove("hidden");

        const spacing = document.querySelector("#ctl-spacing");
        const size = document.querySelector("#ctl-size");
        const thickness = document.querySelector("#ctl-thickness");
        const curve = document.querySelector("#ctl-curve");
        const outSpacing = document.querySelector("#out-spacing");
        const outSize = document.querySelector("#out-size");
        const outThickness = document.querySelector("#out-thickness");
        const outCurve = document.querySelector("#out-curve");
        const sync = () => {
          params.spacing = Number(spacing.value);
          params.size = Number(size.value);
          params.thickness = Number(thickness.value);
          params.curve = Number(curve.value);
          outSpacing.textContent = params.spacing.toFixed(2);
          outSize.textContent = params.size.toFixed(2);
          outThickness.textContent = params.thickness.toFixed(2);
          outCurve.textContent = `${Math.round(params.curve)}°`;
          applyThickness();
          rebuildPath();
        };
        spacing.addEventListener("input", sync);
        size.addEventListener("input", sync);
        thickness.addEventListener("input", sync);
        curve.addEventListener("input", sync);
        sync();
      }

      function applyThickness() {
        if (builtThickness === params.thickness) return;
        builtThickness = params.thickness;
        const next = createDiscGeometry(params.thickness);
        next.computeBoundingBox();
        frontZ = next.boundingBox.max.z;
        for (const mesh of discMeshes) mesh.geometry = next;
        discGeometry.dispose();
        discGeometry = next;
        for (const picker of pickers) picker.position.z = frontZ + 0.02;
      }

      function rebuildPath() {
        if (!(camera.aspect > 0)) return;
        camera.updateMatrixWorld();
        _right.set(1, 0, 0).transformDirection(camera.matrixWorld);
        _up.set(0, 1, 0).transformDirection(camera.matrixWorld);
        _fwd.set(0, 0, -1).transformDirection(camera.matrixWorld);

        const ax = -1;
        const ay = -1;
        const bx = 1;
        const by = 1;
        const chordX = bx - ax;
        const chordY = by - ay;
        const chord = Math.hypot(chordX, chordY);
        const tHatX = chordX / chord;
        const tHatY = chordY / chord;
        const nHatX = chordY / chord;
        const nHatY = -chordX / chord;
        const phi = THREE.MathUtils.degToRad(Math.max(params.curve, 0));
        const count = PATH_SAMPLES;
        pathSamples.length = 0;

        const push = (ndcX, ndcY, distance) => {
          const y = ndcY + (PATH_LIFT_PX / Math.max(canvas.clientHeight, 1)) * 2;
          const point = place(ndcX, y, forwardDepth(ndcX, y, distance), _placed).clone();
          const prev = pathSamples[pathSamples.length - 1];
          const length = prev ? prev.length + point.distanceTo(prev.point) : 0;
          pathSamples.push({ point, length, ndcX, ndcY: y, distance });
        };

        if (phi < 0.001) {
          for (let i = 0; i <= count; i++) {
            const u = i / count;
            push(
              THREE.MathUtils.lerp(ax, bx, u),
              THREE.MathUtils.lerp(ay, by, u),
              THREE.MathUtils.lerp(NEAR_DISTANCE, FAR_DISTANCE, u),
            );
          }
        } else {
          const alpha = phi / 2;
          const radius = chord / 2 / Math.sin(alpha);
          const om = radius * Math.cos(alpha);
          const ox = -nHatX * om;
          const oy = -nHatY * om;
          for (let i = 0; i <= count; i++) {
            const u = i / count;
            const beta = THREE.MathUtils.lerp(-alpha, alpha, u);
            const ndcX = ox + radius * (Math.cos(beta) * nHatX + Math.sin(beta) * tHatX);
            const ndcY = oy + radius * (Math.cos(beta) * nHatY + Math.sin(beta) * tHatY);
            push(ndcX, ndcY, THREE.MathUtils.lerp(NEAR_DISTANCE, FAR_DISTANCE, u));
          }
        }

        focusLength = pathSamples[count / 2].length;
        pathTotal = pathSamples[count].length;
      }

      function forwardDepth(ndcX, ndcY, distance) {
        const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5);
        const radial = Math.hypot(ndcX * camera.aspect, ndcY) * tan;
        return distance / Math.sqrt(1 + radial * radial);
      }

      function place(ndcX, ndcY, depth, target) {
        const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5) * depth;
        const halfW = halfH * camera.aspect;
        return target
          .copy(camera.position)
          .addScaledVector(_fwd, depth)
          .addScaledVector(_right, ndcX * halfW)
          .addScaledVector(_up, ndcY * halfH);
      }

      function pointOnPath(distance, target) {
        const last = pathSamples.length - 1;
        if (last < 1) return target.set(0, 0, 0);
        const probe = focusLength + distance;
        if (probe <= 0) return extendPath(0, 1, -probe, target);
        if (probe >= pathTotal) return extendPath(last, last - 1, probe - pathTotal, target);

        let lo = 0;
        let hi = last;
        while (lo + 1 < hi) {
          const mid = (lo + hi) >> 1;
          if (pathSamples[mid].length < probe) lo = mid;
          else hi = mid;
        }
        const a = pathSamples[lo];
        const b = pathSamples[hi];
        const span = b.length - a.length;
        const f = span > 1e-6 ? (probe - a.length) / span : 0;
        return target.copy(a.point).lerp(b.point, f);
      }

      function extendPath(from, toward, extra, target) {
        const a = pathSamples[from];
        const b = pathSamples[toward];
        const seg = Math.abs(a.length - b.length) || 1;
        const f = extra / seg;
        const ndcX = a.ndcX + (a.ndcX - b.ndcX) * f;
        const ndcY = a.ndcY + (a.ndcY - b.ndcY) * f;
        const distance = Math.min(22, Math.max(3.4, a.distance + (a.distance - b.distance) * f));
        return place(ndcX, ndcY, forwardDepth(ndcX, ndcY, distance), target);
      }

      function screenRadius(worldPoint, scale) {
        const dist = camera.position.distanceTo(worldPoint);
        const fov = THREE.MathUtils.degToRad(camera.fov);
        const worldPerPx = (2 * Math.tan(fov / 2) * dist) / canvas.clientHeight;
        return (RADIUS * 0.92 * scale) / worldPerPx;
      }

      function resize() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        if (width < 2 || height < 2) return;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
        rebuildPath();
      }

      function createShadowTexture() {
        const size = 256;
        const shadowCanvas = document.createElement("canvas");
        shadowCanvas.width = size;
        shadowCanvas.height = size;
        const ctx = shadowCanvas.getContext("2d");
        const gradient = ctx.createRadialGradient(128, 128, 28, 128, 128, 118);
        gradient.addColorStop(0, "rgba(28,24,20,0.5)");
        gradient.addColorStop(0.42, "rgba(28,24,20,0.22)");
        gradient.addColorStop(1, "rgba(28,24,20,0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);
        const texture = new THREE.CanvasTexture(shadowCanvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      function createDiscGeometry(thickness) {
        const shape = new THREE.Shape();
        shape.absarc(0, 0, RADIUS, 0, Math.PI * 2, false);
        const hole = new THREE.Path();
        hole.absarc(0, 0, HOLE, 0, Math.PI * 2, true);
        shape.holes.push(hole);

        const geometry = new THREE.ExtrudeGeometry(shape, {
          depth: 0.04 * thickness,
          bevelEnabled: true,
          bevelThickness: 0.016 * thickness,
          bevelSize: 0.006,
          bevelOffset: 0,
          bevelSegments: 2,
          curveSegments: 80,
          steps: 1,
        });
        geometry.computeBoundingBox();
        const midZ = (geometry.boundingBox.min.z + geometry.boundingBox.max.z) / 2;
        geometry.translate(0, 0, -midZ);
        geometry.computeVertexNormals();
        return geometry;
      }

      function createLabelTexture(title, color) {
        const size = 1024;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d", { alpha: false });
        const ink = luminance(color) > 0.62 ? "#1a1917" : "#f6f3ec";

        ctx.fillStyle = color;
        ctx.fillRect(0, 0, size, size);

        const wash = ctx.createRadialGradient(size * 0.38, size * 0.32, 30, size * 0.5, size * 0.52, size * 0.68);
        wash.addColorStop(0, "rgba(255,255,255,0.16)");
        wash.addColorStop(1, "rgba(0,0,0,0.14)");
        ctx.fillStyle = wash;
        ctx.fillRect(0, 0, size, size);

        ctx.fillStyle = ink;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "600 84px 'Avenir Next', Futura, 'Helvetica Neue', sans-serif";
        drawLines(ctx, title.toUpperCase(), 512, 348, 500, 86);

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texture.wrapS = THREE.ClampToEdgeWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;
        texture.repeat.set(0.5, 0.5);
        texture.offset.set(0.5, 0.5);
        return texture;
      }

      function drawLines(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(" ");
        const lines = [];
        let current = "";
        for (const word of words) {
          const trial = current ? `${current} ${word}` : word;
          if (ctx.measureText(trial).width > maxWidth && current) {
            lines.push(current);
            current = word;
          } else {
            current = trial;
          }
        }
        if (current) lines.push(current);
        const start = y - ((lines.length - 1) * lineHeight) / 2;
        lines.forEach((line, i) => ctx.fillText(line, x, start + i * lineHeight));
      }

      function luminance(hex) {
        const value = hex.replace("#", "");
        const r = parseInt(value.slice(0, 2), 16) / 255;
        const g = parseInt(value.slice(2, 4), 16) / 255;
        const b = parseInt(value.slice(4, 6), 16) / 255;
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      }
    </script>
  </body>
